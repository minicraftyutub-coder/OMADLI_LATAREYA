services:
  - type: web
    name: lotereya-telegram-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_PATH
        value: /opt/render/project/src/lotereya.db
      - key: PUBLIC_URL
        value: https://omadli-latareya.onrender.com
      - key: LIVE_ADMIN_KEY
        sync: false
